<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Toolbox Hub 收集自制网页小工具与实用外部链接，支持快速搜索、浏览和访问常用工具。"
    />
    <meta
      name="keywords"
      content="toolbox, web tools, 在线工具, 小工具, utility, resources"
    />
    <title>Toolbox Hub</title>
    <link rel="stylesheet" href="./assets/site.css" />
  </head>
  <body class="hub-page min-h-screen text-slate-800 antialiased">
    <div class="page-shell">
      <header class="page-header">
        <div>
          <h1 class="page-title">
            Toolbox<span class="text-blue-600">.</span>
          </h1>
          <p class="page-subtitle" id="t-subtitle">
            Fast, Pure, and Efficient Web Tools
          </p>
        </div>

        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="search-input"
            placeholder="搜索工具..."
            class="search-input"
          />
        </div>
      </header>

      <div id="tools-grid" class="tools-grid"></div>

      <div id="no-results" class="empty-state">
        <p class="empty-state-emoji">🏜️</p>
        <p>没有找到相关工具</p>
      </div>
    </div>

    <script>
      // 实时搜索逻辑
      const searchInput = document.getElementById("search-input");
      const grid = document.getElementById("tools-grid");
      const cards = grid.getElementsByClassName("tool-card");
      const noResults = document.getElementById("no-results");

      searchInput.addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        let hasVisible = false;

        Array.from(cards).forEach((card) => {
          const title = card.querySelector("h3").innerText.toLowerCase();
          const path = card.querySelector(".path-text").innerText.toLowerCase();

          if (title.includes(term) || path.includes(term)) {
            card.style.display = "flex";
            hasVisible = true;
          } else {
            card.style.display = "none";
          }
        });

        noResults.style.display = hasVisible ? "none" : "block";
      });
    </script>
  </body>
</html>
